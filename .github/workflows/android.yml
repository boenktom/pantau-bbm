name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: node scripts/prepare-www.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantau-bbm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pantau BBM v1.0.${{ github.run_number }}
          body: |
            Build APK otomatis dari commit ${{ github.sha }}.
            Unduh `app-debug.apk` di bawah, lalu pasang di Android (izinkan "Instal dari sumber tidak dikenal").
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
